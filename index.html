<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <meta name="theme-color"
          content="#0f172a">

    <link rel="manifest"
          href="manifest.json">

    <title>
        AI Food Recognition & Recommendation Agent
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .card {
            background: #1e293b;
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            border-radius: 18px;
            background: black;
            max-height: 500px;
            object-fit: cover;
        }

        canvas {
            display: none;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 17px;
            margin-top: 14px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #scanButton {
            background: #22c55e;
            color: white;
        }

        #switchButton {
            background: #475569;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 16px;
            font-size: 17px;
            color: #cbd5e1;
        }

        .result-card {
            display: none;
            background: #1e293b;
            border-radius: 22px;
            padding: 20px;
            margin-top: 20px;
        }

        .food-name {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #22c55e;
        }

        .confidence {
            color: #cbd5e1;
            margin-bottom: 18px;
        }

        .section {
            background: #334155;
            border-radius: 15px;
            padding: 15px;
            margin-top: 14px;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .section-text {
            color: #e2e8f0;
            line-height: 1.5;
        }

        .error {
            color: #f87171;
        }

        .loading {
            color: #facc15;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>
        🍽️ AI Food Recognition
    </h1>

    <div class="subtitle">
        & Recommendation Agent
    </div>


    <div class="card">

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <canvas
            id="canvas">
        </canvas>


        <button
            id="scanButton">
            📷 Scan Food
        </button>


        <button
            id="switchButton">
            🔄 Switch Camera
        </button>


        <div id="status">
            Starting camera...
        </div>

    </div>


    <div
        id="resultCard"
        class="result-card">

        <div
            id="foodName"
            class="food-name">
        </div>

        <div
            id="confidence"
            class="confidence">
        </div>


        <div class="section">
            <div class="section-title">
                🌍 Cuisine
            </div>

            <div
                id="cuisine"
                class="section-text">
            </div>
        </div>


        <div class="section">
            <div class="section-title">
                📝 Description
            </div>

            <div
                id="description"
                class="section-text">
            </div>
        </div>


        <div class="section">
            <div class="section-title">
                👀 Visible Items
            </div>

            <div
                id="visibleItems"
                class="section-text">
            </div>
        </div>


        <div class="section">
            <div class="section-title">
                🍴 Recommendation
            </div>

            <div
                id="recommendation"
                class="section-text">
            </div>
        </div>


        <div class="section">
            <div class="section-title">
                ❤️ Health Note
            </div>

            <div
                id="healthNote"
                class="section-text">
            </div>
        </div>


        <div class="section">
            <div class="section-title">
                🔁 Similar Food
            </div>

            <div
                id="similarFood"
                class="section-text">
            </div>
        </div>

    </div>

</div>


<script>

const BACKEND_URL =
    "https://foodai-pwa.onrender.com";

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const scanButton =
    document.getElementById("scanButton");

const switchButton =
    document.getElementById("switchButton");

const statusText =
    document.getElementById("status");

const resultCard =
    document.getElementById("resultCard");


let currentStream = null;

let facingMode =
    "environment";


async function startCamera() {

    try {

        if (currentStream) {

            currentStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        const constraints = {

            video: {

                facingMode:
                    facingMode,

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }

            },

            audio: false

        };


        currentStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            currentStream;


        statusText.textContent =
            "Camera ready. Show a food and tap Scan Food.";

        statusText.className =
            "";

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        statusText.textContent =
            "Camera permission failed. Please allow camera access.";

        statusText.className =
            "error";

    }

}


switchButton.addEventListener(
    "click",
    async () => {

        facingMode =
            facingMode ===
            "environment"
                ?
            "user"
                :
            "environment";


        await startCamera();

    }
);


scanButton.addEventListener(
    "click",
    async () => {

        if (
            !video.videoWidth ||
            !video.videoHeight
        ) {

            statusText.textContent =
                "Camera is not ready.";

            statusText.className =
                "error";

            return;

        }


        scanButton.disabled =
            true;

        statusText.textContent =
            "🔍 AI is analyzing the food...";

        statusText.className =
            "loading";

        resultCard.style.display =
            "none";


        const width =
            video.videoWidth;

        const height =
            video.videoHeight;


        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        canvas.toBlob(

            async (blob) => {

                try {

                    if (!blob) {

                        throw new Error(
                            "Could not capture image."
                        );

                    }


                    const formData =
                        new FormData();


                    formData.append(
                        "image",
                        blob,
                        "food.jpg"
                    );


                    const response =
                        await fetch(

                            BACKEND_URL +
                            "/predict",

                            {
                                method:
                                    "POST",

                                body:
                                    formData
                            }

                        );


                    const contentType =
                        response.headers.get(
                            "content-type"
                        );


                    if (
                        !contentType ||
                        !contentType.includes(
                            "application/json"
                        )
                    ) {

                        const text =
                            await response.text();

                        throw new Error(
                            "Backend returned a non-JSON response."
                        );

                    }


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Server error"
                        );

                    }


                    if (!data.success) {

                        statusText.textContent =
                            data.message ||
                            data.error ||
                            "No food confidently detected.";

                        statusText.className =
                            "error";

                        scanButton.disabled =
                            false;

                        return;

                    }


                    showResult(
                        data
                    );


                    statusText.textContent =
                        "✅ Food recognized successfully.";

                    statusText.className =
                        "";


                }

                catch (error) {

                    console.error(
                        error
                    );


                    statusText.textContent =
                        "Error: " +
                        error.message;

                    statusText.className =
                        "error";

                }

                finally {

                    scanButton.disabled =
                        false;

                }

            },

            "image/jpeg",

            0.90

        );

    }
);


function showResult(data) {

    resultCard.style.display =
        "block";


    document
        .getElementById(
            "foodName"
        )
        .textContent =
        data.food ||
        "Unknown Food";


    document
        .getElementById(
            "confidence"
        )
        .textContent =
        "Confidence: " +
        (
            data.confidence ??
            0
        ) +
        "%";


    document
        .getElementById(
            "cuisine"
        )
        .textContent =
        data.cuisine ||
        "Unknown";


    document
        .getElementById(
            "description"
        )
        .textContent =
        data.description ||
        "No description available.";


    const visibleItems =
        Array.isArray(
            data.visible_items
        )
            ?
        data.visible_items
            :
        [];


    document
        .getElementById(
            "visibleItems"
        )
        .textContent =
        visibleItems.length
            ?
        visibleItems.join(", ")
            :
        "No additional items identified.";


    document
        .getElementById(
            "recommendation"
        )
        .textContent =
        data.recommendation ||
        "No recommendation available.";


    document
        .getElementById(
            "healthNote"
        )
        .textContent =
        data.health_note ||
        "Nutrition depends on ingredients and portion size.";


    document
        .getElementById(
            "similarFood"
        )
        .textContent =
        data.similar_food ||
        "No similar food suggested.";

}


if (
    "serviceWorker"
    in navigator
) {

    window.addEventListener(
        "load",
        () => {

            navigator
                .serviceWorker
                .register(
                    "service-worker.js"
                )
                .catch(
                    error =>
                        console.log(
                            "Service worker error:",
                            error
                        )
                );

        }
    );

}


startCamera();

</script>

</body>
</html>
