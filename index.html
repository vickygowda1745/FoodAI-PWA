<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>
        AI Food Recognition & Recommendation Agent
    </title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #0f172a;

            color:
                white;

        }


        .container {

            width: 100%;

            max-width: 720px;

            margin: auto;

            padding: 18px;

        }


        h1 {

            text-align: center;

            margin-bottom: 5px;

            font-size: 30px;

        }


        .subtitle {

            text-align: center;

            color: #94a3b8;

            margin-bottom: 20px;

            font-size: 17px;

        }


        .card {

            background: #1e293b;

            border-radius: 22px;

            padding: 16px;

            margin-bottom: 18px;

        }


        video {

            width: 100%;

            border-radius: 18px;

            background: black;

            object-fit: cover;

            max-height: 520px;

        }


        canvas {
            display: none;
        }


        button {

            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 16px;

            margin-top: 13px;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

        }


        #scanButton {

            background: #22c55e;

            color: white;

        }


        #switchButton {

            background: #475569;

            color: white;

        }


        button:disabled {

            opacity: 0.55;

        }


        #status {

            margin-top: 15px;

            text-align: center;

            color: #cbd5e1;

            font-size: 16px;

            line-height: 1.5;

        }


        .loading {

            color: #facc15 !important;

        }


        .error {

            color: #f87171 !important;

        }


        .success {

            color: #4ade80 !important;

        }


        .result-card {

            display: none;

            background: #1e293b;

            border-radius: 22px;

            padding: 20px;

            margin-top: 18px;

        }


        .food-name {

            font-size: 31px;

            font-weight: bold;

            color: #22c55e;

            margin-bottom: 8px;

        }


        .confidence {

            color: #cbd5e1;

            font-size: 17px;

            margin-bottom: 16px;

        }


        .details-loading {

            color: #facc15;

            margin: 15px 0;

        }


        .section {

            background: #334155;

            border-radius: 15px;

            padding: 15px;

            margin-top: 13px;

        }


        .section-title {

            font-weight: bold;

            margin-bottom: 7px;

            font-size: 17px;

        }


        .section-text {

            color: #e2e8f0;

            line-height: 1.5;

        }


        #detailsArea {

            display: none;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        🍽️ AI Food Recognition
    </h1>


    <div class="subtitle">
        & Recommendation Agent
    </div>


    <div class="card">


        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>


        <canvas
            id="canvas"
        ></canvas>


        <button
            id="scanButton"
        >
            📷 Scan Food
        </button>


        <button
            id="switchButton"
        >
            🔄 Switch Camera
        </button>


        <div
            id="status"
        >
            Starting camera...
        </div>


    </div>


    <div
        id="resultCard"
        class="result-card"
    >


        <div
            id="foodName"
            class="food-name"
        >
        </div>


        <div
            id="confidence"
            class="confidence"
        >
        </div>


        <div
            id="detailsLoading"
            class="details-loading"
        >
            Loading recommendations...
        </div>


        <div
            id="detailsArea"
        >


            <div class="section">

                <div class="section-title">
                    🌍 Cuisine
                </div>

                <div
                    id="cuisine"
                    class="section-text"
                >
                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    📝 Description
                </div>

                <div
                    id="description"
                    class="section-text"
                >
                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    👀 Visible Items
                </div>

                <div
                    id="visibleItems"
                    class="section-text"
                >
                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    🍴 Recommendation
                </div>

                <div
                    id="recommendation"
                    class="section-text"
                >
                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    ❤️ Health Note
                </div>

                <div
                    id="healthNote"
                    class="section-text"
                >
                </div>

            </div>


            <div class="section">

                <div class="section-title">
                    🔁 Similar Food
                </div>

                <div
                    id="similarFood"
                    class="section-text"
                >
                </div>

            </div>


        </div>


    </div>


</div>


<script>


const BACKEND_URL =
    "https://foodai-pwa.onrender.com";


const video =
    document.getElementById(
        "camera"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const scanButton =
    document.getElementById(
        "scanButton"
    );


const switchButton =
    document.getElementById(
        "switchButton"
    );


const statusText =
    document.getElementById(
        "status"
    );


const resultCard =
    document.getElementById(
        "resultCard"
    );


const foodName =
    document.getElementById(
        "foodName"
    );


const confidence =
    document.getElementById(
        "confidence"
    );


const detailsLoading =
    document.getElementById(
        "detailsLoading"
    );


const detailsArea =
    document.getElementById(
        "detailsArea"
    );


let currentStream = null;

let facingMode =
    "environment";


let lastBlob = null;

let lastFoodName = null;



// ============================================================
// CAMERA
// ============================================================

async function startCamera() {


    try {


        if (currentStream) {

            currentStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        const constraints = {

            video: {

                facingMode:
                    facingMode,

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                }

            },

            audio: false

        };


        currentStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            currentStream;


        statusText.textContent =
            "Camera ready. Show food and tap Scan Food.";


        statusText.className =
            "success";


    }

    catch (error) {


        console.error(
            error
        );


        statusText.textContent =
            "Camera permission failed. Allow camera access.";


        statusText.className =
            "error";


    }

}



// ============================================================
// SWITCH CAMERA
// ============================================================

switchButton.addEventListener(

    "click",

    async () => {


        facingMode =
            facingMode ===
            "environment"
                ?
            "user"
                :
            "environment";


        await startCamera();


    }

);



// ============================================================
// CAPTURE SMALL IMAGE
// ============================================================

function captureImage() {


    return new Promise(

        (resolve, reject) => {


            if (
                !video.videoWidth ||
                !video.videoHeight
            ) {

                reject(
                    new Error(
                        "Camera is not ready."
                    )
                );

                return;

            }


            /*
            Smaller image = faster upload
            and faster AI processing
            */

            const TARGET_WIDTH =
                640;


            const ratio =
                video.videoHeight /
                video.videoWidth;


            const TARGET_HEIGHT =
                Math.round(
                    TARGET_WIDTH *
                    ratio
                );


            canvas.width =
                TARGET_WIDTH;


            canvas.height =
                TARGET_HEIGHT;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            ctx.drawImage(

                video,

                0,
                0,

                TARGET_WIDTH,
                TARGET_HEIGHT

            );


            canvas.toBlob(

                blob => {


                    if (!blob) {

                        reject(
                            new Error(
                                "Image capture failed."
                            )
                        );

                        return;

                    }


                    resolve(
                        blob
                    );


                },

                "image/jpeg",

                0.72

            );


        }

    );

}



// ============================================================
// FAST IDENTIFICATION
// ============================================================

async function identifyFood(
    blob
) {


    const formData =
        new FormData();


    formData.append(

        "image",

        blob,

        "food.jpg"

    );


    const response =
        await fetch(

            BACKEND_URL +
            "/identify",

            {

                method:
                    "POST",

                body:
                    formData

            }

        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(

            data.error ||
            "Food recognition failed."

        );

    }


    return data;

}



// ============================================================
// DETAILS
// ============================================================

async function loadDetails(
    blob,
    food
) {


    try {


        const formData =
            new FormData();


        formData.append(

            "image",

            blob,

            "food.jpg"

        );


        formData.append(

            "food",

            food

        );


        const response =
            await fetch(

                BACKEND_URL +
                "/details",

                {

                    method:
                        "POST",

                    body:
                        formData

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(

                data.error ||
                "Recommendation failed."

            );

        }


        showDetails(
            data
        );


    }

    catch (error) {


        console.error(
            error
        );


        detailsLoading.textContent =
            "Recommendations temporarily unavailable.";


        detailsLoading.className =
            "error";


    }

}



// ============================================================
// DISPLAY DETAILS
// ============================================================

function showDetails(
    data
) {


    detailsLoading.style.display =
        "none";


    detailsArea.style.display =
        "block";


    document
        .getElementById(
            "cuisine"
        )
        .textContent =
        data.cuisine ||
        "Unknown";


    document
        .getElementById(
            "description"
        )
        .textContent =
        data.description ||
        "No description available.";


    const items =
        Array.isArray(
            data.visible_items
        )
            ?
        data.visible_items
            :
        [];


    document
        .getElementById(
            "visibleItems"
        )
        .textContent =
        items.length
            ?
        items.join(", ")
            :
        "No additional items identified.";


    document
        .getElementById(
            "recommendation"
        )
        .textContent =
        data.recommendation ||
        "No recommendation available.";


    document
        .getElementById(
            "healthNote"
        )
        .textContent =
        data.health_note ||
        "Nutrition depends on ingredients and portion size.";


    document
        .getElementById(
            "similarFood"
        )
        .textContent =
        data.similar_food ||
        "No similar food suggested.";

}



// ============================================================
// SCAN BUTTON
// ============================================================

scanButton.addEventListener(

    "click",

    async () => {


        try {


            scanButton.disabled =
                true;


            resultCard.style.display =
                "none";


            detailsArea.style.display =
                "none";


            detailsLoading.style.display =
                "block";


            detailsLoading.className =
                "details-loading";


            detailsLoading.textContent =
                "Loading recommendations...";


            statusText.textContent =
                "⚡ Identifying food...";


            statusText.className =
                "loading";


            // Capture once

            const blob =
                await captureImage();


            lastBlob =
                blob;


            // FAST recognition

            const result =
                await identifyFood(
                    blob
                );


            lastFoodName =
                result.food;


            // Show immediately

            resultCard.style.display =
                "block";


            foodName.textContent =
                result.food ||
                "Unknown Food";


            confidence.textContent =
                "Confidence: " +
                (
                    result.confidence ??
                    0
                ) +
                "%";


            statusText.textContent =
                "✅ Food identified";


            statusText.className =
                "success";


            /*
            Load recommendation AFTER
            food name is already visible
            */

            loadDetails(

                blob,

                result.food

            );


        }

        catch (error) {


            console.error(
                error
            );


            statusText.textContent =
                "Error: " +
                error.message;


            statusText.className =
                "error";


        }

        finally {


            scanButton.disabled =
                false;


        }


    }

);



// ============================================================
// SERVICE WORKER
// ============================================================

if (
    "serviceWorker"
    in navigator
) {


    window.addEventListener(

        "load",

        () => {


            navigator
                .serviceWorker
                .register(
                    "service-worker.js"
                )
                .catch(
                    error =>
                        console.log(
                            error
                        )
                );


        }

    );


}



// ============================================================
// START CAMERA
// ============================================================

startCamera();


</script>


</body>

</html>
